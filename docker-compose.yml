version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pedidos-db
    environment:
      POSTGRES_DB: pedidosdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pedidosdb"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./PedidosAPI
      dockerfile: Dockerfile
    container_name: pedidos-api
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=pedidosdb;Username=postgres;Password=postgres
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pedidos-web
    ports:
      - "3000:80"
    depends_on:
      - backend

  microservice:
    build:
      context: ./microservice
      dockerfile: Dockerfile
    container_name: pedidos-microservice
    ports:
      - "4000:4000"

volumes:
  postgres_data: